# Netlify configuration for the Pelham Civic Guide

[build]
  # Static site — the HTML is generated by `npm run build` and committed, so
  # Netlify has nothing to build. Publish the repo root.
  publish = "."
  functions = "netlify/functions"

# Front-end calls /api/ask; route it to the proxy function.
[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask-pelham"
  status = 200
  force = true

# ── Clean URLs ────────────────────────────────────────────────────────────
# Netlify's "Pretty URLs" post-processing usually serves /issues from
# issues.html on its own, but it is a dashboard setting that can be switched
# off without anyone noticing the links break. These make it explicit and
# independent of that toggle. status 200 rewrites rather than redirects, so
# the clean URL is what stays in the address bar.
# Generated from content/pages.json — keep in step when adding a page.

[[redirects]]
  from = "/issues"
  to = "/issues.html"
  status = 200

[[redirects]]
  from = "/elections"
  to = "/elections.html"
  status = 200

[[redirects]]
  from = "/meetings"
  to = "/meetings.html"
  status = 200

[[redirects]]
  from = "/get-involved"
  to = "/get-involved.html"
  status = 200

[[redirects]]
  from = "/taxes"
  to = "/taxes.html"
  status = 200

[[redirects]]
  from = "/gov-101"
  to = "/gov-101.html"
  status = 200

[[redirects]]
  from = "/ask"
  to = "/ask.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
